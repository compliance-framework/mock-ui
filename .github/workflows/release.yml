name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
