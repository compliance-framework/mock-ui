name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@899dbe5d7dac02de5fd60a92d764b189259e03dd # v1.5.0
    with:
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
