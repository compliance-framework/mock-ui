name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    with:
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
