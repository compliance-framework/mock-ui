name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@d72b127a668e93d3eb503f775fb4c2bbb0bfdef9 # v1.2.0
    with:
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
