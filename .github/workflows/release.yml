name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Tracks the top branch of the compliance-framework/workflows stack until it merges.
    uses: compliance-framework/workflows/.github/workflows/release-ui.yml@ra/w1-s1-t05b-repo-settings-workflow
    with:
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
    secrets: inherit
