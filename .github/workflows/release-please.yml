name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@5a81b1ac6081babf702713afb497d5a4f5c662bf # v1.0.0
    permissions:
      contents: read
    secrets: inherit
