name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@7b55019ed36050a57eb8273f6a67fd4b2395adb0 # v1.5.1
    permissions:
      contents: read
    secrets: inherit
