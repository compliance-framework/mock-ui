name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # Tracks the top branch of the compliance-framework/workflows stack until it merges.
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@ra/w1-s1-t05b-repo-settings-workflow
    permissions:
      contents: read
    secrets: inherit
