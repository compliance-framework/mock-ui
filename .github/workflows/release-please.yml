name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please

jobs:
  release-please:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/release-please.yml@21aaac7c174aaf90abafecf1c90c30b238367d3d # v1.3.1
    permissions:
      contents: read
    secrets: inherit
