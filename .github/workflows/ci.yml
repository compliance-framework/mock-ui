name: ci

on:
  pull_request:
    # labeled/unlabeled re-run release-checks when release:major-approved changes.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/ci-ui.yml@main
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    # Acts only on release-please--* PRs; skipped (counts as passing) elsewhere.
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@main
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: failure()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@main
    with:
      # Keep equal to the ref notify-failure.yml is called at.
      workflows-ref: main
    permissions:
      actions: read
      contents: read
    secrets: inherit
