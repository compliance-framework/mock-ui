name: ci

on:
  pull_request:
    # labeled/unlabeled re-run release-checks when release:major-approved changes.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/ci-ui.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    # Acts only on release-please--* PRs; skipped (counts as passing) elsewhere.
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
