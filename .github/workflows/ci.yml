name: ci

on:
  pull_request:
    # labeled/unlabeled re-run release-checks when release:major-approved changes.
    # closed: notify marks the PR's needs-human card handled and closes its CI incident.
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  push:
    branches: [main]

permissions: {}

jobs:
  ci:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/ci-ui.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  release-checks:
    # Acts only on release-please--* PRs; skipped (counts as passing) elsewhere.
    uses: compliance-framework/workflows/.github/workflows/release-checks.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    permissions:
      contents: read

  notify:
    needs: [ci, release-checks]
    if: always()
    uses: compliance-framework/workflows/.github/workflows/notify-failure.yml@05d2c3233de6e302c4ff891dde1132d440c081e4 # v1.6.0
    with:
      needs: ${{ toJSON(needs) }}
    permissions:
      contents: read
    secrets: inherit
