name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Tracks compliance-framework/workflows main until v1 is tagged.
    uses: compliance-framework/workflows/.github/workflows/preview.yml@ec58cea2c02f12b5dad6b23a7bfdc84360f59f11 # v1.3.0
    with:
      kind: image
      on-main: true
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
