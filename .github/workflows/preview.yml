name: preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Tracks the top branch of the compliance-framework/workflows stack until it merges.
    uses: compliance-framework/workflows/.github/workflows/preview.yml@ra/w1-s1-t05b-repo-settings-workflow
    with:
      kind: image
      on-main: true
      images: '[{"name": "mock-ui", "dockerfile": "Dockerfile"}]'
    permissions:
      contents: read
      packages: write
